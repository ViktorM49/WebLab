<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
</head>
<body style="background-image: url('../images/1.png'); background-size: cover;">
    <h1>Форма реєстрації</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>Personal information</legend>
  
        <label for="name">Your name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>
  
        <label for="age">Your age:</label>
        <input type="number" id="age" name="age" placeholder="Enter your age"><br><br>
      </fieldset>
  
      <br>
  
      <label for="password">Your password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
  
      <label>Male</label>
      <input type="radio" name="gender" value="male">
  
      <label>Female</label>
      <input type="radio" name="gender" value="female"><br><br>
  
      <label>Remember me:</label>
      <input type="checkbox" name="remember"><br><br>
  
      <label for="city">Select your city:</label>
      <select name="city" id="city">
        <option value="Kyiv">Kyiv</option>
        <option value="Lviv">Lviv</option>
        <option value="Odesa">Odesa</option>
        <option value="Kharkiv">Kharkiv</option>
        <option value="Dnipro">Dnipro</option>
      </select><br><br>
  
      <label for="message">Enter your message:</label>
      <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>
  
      <button type="submit">Submit</button>
    </form>
  
</body>
</html>
